<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snip Area</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: rgba(10, 15, 25, 0.25);
      cursor: crosshair;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #selectionBox {
      position: absolute;
      border: 2px dashed #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      display: none;
      pointer-events: none;
    }
    #hint {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      color: #e2e8f0;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint">✂️ Drag a box around the CODING QUESTION (Press Esc to Cancel)</div>
  <div id="selectionBox"></div>

  <script>
    const box = document.getElementById('selectionBox');
    let startX = 0, startY = 0, isDragging = false;

    window.addEventListener('mousedown', (e) => {
      startX = e.clientX;
      startY = e.clientY;
      isDragging = true;
      box.style.left = startX + 'px';
      box.style.top = startY + 'px';
      box.style.width = '0px';
      box.style.height = '0px';
      box.style.display = 'block';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const curX = e.clientX;
      const curY = e.clientY;
      const left = Math.min(startX, curX);
      const top = Math.min(startY, curY);
      const width = Math.abs(curX - startX);
      const height = Math.abs(curY - startY);

      box.style.left = left + 'px';
      box.style.top = top + 'px';
      box.style.width = width + 'px';
      box.style.height = height + 'px';
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const endX = e.clientX;
      const endY = e.clientY;
      const left = Math.min(startX, endX);
      const top = Math.min(startY, endY);
      const width = Math.abs(endX - startX);
      const height = Math.abs(endY - startY);

      box.style.display = 'none';

      // Minimum selection threshold
      if (width > 20 && height > 20) {
        if (window.copilotAPI && window.copilotAPI.sendSnipCompleted) {
          window.copilotAPI.sendSnipCompleted({ x: left, y: top, width, height });
        }
      } else {
        if (window.copilotAPI && window.copilotAPI.sendSnipCancelled) {
          window.copilotAPI.sendSnipCancelled();
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (window.copilotAPI && window.copilotAPI.sendSnipCancelled) {
          window.copilotAPI.sendSnipCancelled();
        }
      }
    });
  </script>
</body>
</html>
